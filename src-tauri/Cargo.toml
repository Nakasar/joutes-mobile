[package]
name = "joutes-mobile"
version = "0.27.1"
description = "Application mobile Joutes (client de l'API joutes.app)"
authors = ["Joutes"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "joutes_mobile_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
# `cookies` : gestion native du cookie de session Better Auth, avec
# persistance sur disque entre les lancements de l'app.
tauri-plugin-http = { version = "2", features = ["cookies"] }
# Scan QR natif (rejoindre un tournoi) : implémenté sur Android/iOS uniquement.
tauri-plugin-barcode-scanner = "2"
# Notifications push. La feature `push-notifications` ajoute APNs sur iOS et
# FCM sur Android ; sans elle le plugin s'en tient aux notifications locales.
# Le jeton rendu est celui du système — un jeton APNs sur iOS, pas un jeton FCM
# obtenu par échange, ce qui est la raison du choix de ce plugin-là.
tauri-plugin-notifications = { version = "0.4", features = ["push-notifications"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
