name: Mobile build

# Construit l'application pour Android (APK + AAB) et iOS/iPadOS (IPA).
#
# Déclencheurs : manuel (workflow_dispatch) et tags de version `v*`.
# Sur un tag, les artefacts sont aussi attachés à une release GitHub.
#
# Signature (optionnelle, via les secrets du dépôt) :
#   Android : ANDROID_KEYSTORE (base64 du .jks), ANDROID_KEYSTORE_PASSWORD,
#             ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
#   iOS     : ASC_KEY_ID (Key ID), ASC_ISSUER_ID (Issuer ID), ASC_API_KEY (base64 du fichier .p8),
#             APPLE_DEVELOPMENT_TEAM (identifiant d'équipe)
# Sans secrets, le build produit des artefacts non signés (Android) ou un
# .app non signé (iOS) qui valide la compilation.
#
# Clé API App Store Connect (Users and Access > Integrations > App Store
# Connect API), utilisée à la fois pour l'auto-provisioning iOS pendant le
# build et pour l'upload sur tag :
#   ASC_KEY_ID (Key ID), ASC_ISSUER_ID (Issuer ID),
#   ASC_API_KEY (base64 du fichier .p8)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android (APK + AAB)
    runs-on: ubuntu-latest
    env:
      # Expose la présence des secrets de signature via un flag `env` ('true'/'false')
      # afin de simplifier les conditions `if:` des steps.
      HAS_ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Configure Android NDK
        run: echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"

      - run: npm ci

      - name: Initialize Android project
        run: npm run tauri -- android init --ci

      - name: Build APK and AAB (arm64)
        run: npm run tauri -- android build --target aarch64 --apk --aab

      - name: Sign artifacts
        if: env.HAS_ANDROID_KEYSTORE == 'true'
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          KEYSTORE="$RUNNER_TEMP/keystore.jks"
          echo "$ANDROID_KEYSTORE" | base64 -d > "$KEYSTORE"
          BUILD_TOOLS="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"

          find src-tauri/gen/android -name '*-unsigned.apk' | while read -r APK; do
            ALIGNED="${APK%-unsigned.apk}-aligned.apk"
            SIGNED="${APK%-unsigned.apk}-signed.apk"
            "$BUILD_TOOLS/zipalign" -f -p 4 "$APK" "$ALIGNED"
            "$BUILD_TOOLS/apksigner" sign \
              --ks "$KEYSTORE" \
              --ks-pass "pass:$ANDROID_KEYSTORE_PASSWORD" \
              --ks-key-alias "$ANDROID_KEY_ALIAS" \
              --key-pass "pass:$ANDROID_KEY_PASSWORD" \
              --out "$SIGNED" "$ALIGNED"
            rm -f "$ALIGNED"
          done

          find src-tauri/gen/android -name '*.aab' | while read -r AAB; do
            jarsigner -keystore "$KEYSTORE" \
              -storepass "$ANDROID_KEYSTORE_PASSWORD" \
              -keypass "$ANDROID_KEY_PASSWORD" \
              "$AAB" "$ANDROID_KEY_ALIAS"
          done

          rm -f "$KEYSTORE"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: joutes-android-apk
          path: src-tauri/gen/android/app/build/outputs/apk/**/release/*.apk
          if-no-files-found: error

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: joutes-android-aab
          path: src-tauri/gen/android/app/build/outputs/bundle/**/*.aab
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/gen/android/app/build/outputs/apk/**/release/*.apk
            src-tauri/gen/android/app/build/outputs/bundle/**/*.aab

  ios:
    name: iOS / iPadOS (IPA)
    runs-on: macos-latest
    env:
      # Expose la présence des secrets de signature via un flag `env` ('true'/'false')
      # afin de simplifier les conditions `if:` des steps.
      HAS_ASC_API_KEY: ${{ secrets.ASC_KEY_ID != '' && secrets.ASC_ISSUER_ID != '' && secrets.ASC_API_KEY != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Configure App Store Connect API key
        if: env.HAS_ASC_API_KEY == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_API_KEY: ${{ secrets.ASC_API_KEY }}
        run: |
          set -euo pipefail
          # Permet à xcodebuild (via -allowProvisioningUpdates) de créer ou
          # récupérer automatiquement un provisioning profile valide pour le
          # certificat importé, au lieu de dépendre d'un .mobileprovision
          # statique qui peut se désynchroniser du certificat.
          KEY_PATH="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          echo "$ASC_API_KEY" | base64 -d > "$KEY_PATH"
          {
            echo "APPLE_API_KEY=$ASC_KEY_ID"
            echo "APPLE_API_ISSUER=$ASC_ISSUER_ID"
            echo "APPLE_API_KEY_PATH=$KEY_PATH"
          } >> "$GITHUB_ENV"

      - name: Initialize iOS project
        env:
          APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_DEVELOPMENT_TEAM }}
        run: npm run tauri -- ios init --ci

      - name: Build signed IPA
        if: env.HAS_ASC_API_KEY == 'true'
        env:
          # Aucun certificat ni provisioning profile fournis ici : avec la
          # clé API configurée ci-dessus et -allowProvisioningUpdates (activé
          # par tauri ios build), Xcode gère lui-même la signature ("Cloud
          # signing", cf. https://tauri.app/distribute/app-store/#ios).
          APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_DEVELOPMENT_TEAM }}
        run: npm run tauri ios build -- --export-method app-store-connect

      - name: Build unsigned app (no signing secrets)
        if: env.HAS_ASC_API_KEY != 'true'
        run: |
          set -euo pipefail
          PROJECT=$(find src-tauri/gen/apple -maxdepth 1 -name '*.xcodeproj')
          SCHEME=$(xcodebuild -project "$PROJECT" -list -json \
            | jq -r '.project.schemes[] | select(endswith("_iOS"))')
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" build
          # Empaquette le .app non signé dans un pseudo-IPA pour l'artefact
          mkdir -p Payload
          cp -R build/Build/Products/release-iphoneos/*.app Payload/
          zip -qr joutes-ios-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: joutes-ios-ipa
          path: |
            src-tauri/gen/apple/build/**/*.ipa
            joutes-ios-unsigned.ipa
          if-no-files-found: error

      - name: Attach to release
        if: ${{ startsWith(github.ref, 'refs/tags/') && env.HAS_ASC_API_KEY == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/gen/apple/build/**/*.ipa

      - name: Upload to App Store Connect
        if: ${{ startsWith(github.ref, 'refs/tags/') && env.HAS_ASC_API_KEY == 'true' }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_API_KEY: ${{ secrets.ASC_API_KEY }}
        run: |
          set -euo pipefail
          KEYS_DIR="$HOME/private_keys"
          mkdir -p "$KEYS_DIR"
          echo "$ASC_API_KEY" | base64 -d > "$KEYS_DIR/AuthKey_${ASC_KEY_ID}.p8"

          IPA=$(find src-tauri/gen/apple/build -name '*.ipa' | head -n1)
          if [ -z "$IPA" ]; then
            echo "Aucune IPA signée trouvée à uploader." >&2
            exit 1
          fi

          xcrun altool --upload-app \
            -f "$IPA" \
            -t ios \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID"

          rm -f "$KEYS_DIR/AuthKey_${ASC_KEY_ID}.p8"
